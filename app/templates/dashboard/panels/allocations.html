<section class="content-panel" id="allocations-panel">
  <div class="panel">
    <div class="panel-head">
      <div>
        <h2>分配记录</h2>
        <p class="muted">按 PID、MAC 或显示标识检索已经下发的授权记录。</p>
      </div>
      <div class="panel-head-actions">
        <form id="allocation-search-form" class="inline-form">
          <label class="toolbar-field toolbar-field-wide">
            <span>关键词</span>
            <input id="allocation-search" type="search" placeholder="搜索 PID / MAC / 显示标识">
          </label>
          <button type="submit" class="ghost-btn">查询</button>
        </form>
        <button type="button" class="ghost-btn" id="allocations-refresh-btn">刷新记录</button>
      </div>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>PID</th>
            <th>MAC</th>
            <th>显示标识</th>
            <th>批次</th>
            <th>分配时间</th>
          </tr>
        </thead>
        <tbody id="allocations-body"></tbody>
      </table>
    </div>
    <div class="table-meta" id="allocations-meta"></div>
    <div class="pagination-bar" id="allocations-pagination">
      <label class="pagination-field">
        <span>每页</span>
        <select id="allocations-page-size">
          <option value="20">20</option>
          <option value="50">50</option>
          <option value="100">100</option>
        </select>
      </label>
      <button type="button" class="ghost-btn pagination-btn" id="allocations-prev-page">上一页</button>
      <span class="pagination-info" id="allocations-page-indicator">第 1 / 1 页</span>
      <button type="button" class="ghost-btn pagination-btn" id="allocations-next-page">下一页</button>
      <label class="pagination-field">
        <span>跳转到</span>
        <input type="number" id="allocations-page-jump" min="1" value="1">
      </label>
      <button type="button" class="ghost-btn pagination-btn" id="allocations-page-go">跳转</button>
    </div>
  </div>
</section>
