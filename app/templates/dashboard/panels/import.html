<section class="content-panel" id="import-panel">
  <div class="panel">
    <div class="panel-head">
      <div>
        <h2>导入授权数据</h2>
        <p class="muted">支持 Excel 首个工作表导入，可在文件内提供 `pid` 列，也可填写默认 PID。</p>
      </div>
    </div>
    <form id="import-form" class="import-form">
      <label>
        <span>默认 PID</span>
        <input type="text" name="default_pid" placeholder="可选，文件中没有 pid 列时使用">
      </label>
      <label class="file-field">
        <span>Excel 文件</span>
        <input type="file" name="file" accept=".xlsx" required>
      </label>
      <button type="submit" class="primary-btn">开始导入</button>
    </form>
    <div id="import-result" class="muted"></div>
  </div>
</section>
