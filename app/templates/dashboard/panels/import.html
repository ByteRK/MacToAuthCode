<section class="content-panel" id="import-panel">
  <div class="panel">
    <div class="panel-head">
      <div>
        <h2>导入授权数据</h2>
        <p class="muted">支持 Excel 首个工作表导入。每条记录必须包含 `did` 和 `license`，可在文件内提供 `pid` 列，也可填写默认 PID。</p>
      </div>
    </div>
    <form id="import-form" class="import-form">
      <label>
        <span>默认 PID</span>
        <input type="text" name="default_pid" placeholder="可选，文件中没有 pid 列时使用">
      </label>
      <label class="file-field">
        <span>Excel 文件</span>
        <input id="import-file-input" type="file" name="file" accept=".xlsx" required>
        <span id="import-file-note" class="file-field-note">支持 .xlsx，当前未选择文件</span>
      </label>
      <button type="submit" class="primary-btn">开始导入</button>
    </form>
    <div id="import-result" class="import-feedback muted"></div>
    <div id="import-errors" class="import-error-box hidden">
      <div class="import-error-title">失败明细</div>
      <ul id="import-errors-list" class="import-error-list"></ul>
    </div>
  </div>
</section>
