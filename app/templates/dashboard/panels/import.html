<section class="content-panel" id="import-panel">
  <div class="panel">
    <div class="panel-head">
      <div>
        <h2>导入数据</h2>
        <p class="muted">支持 Excel 首个工作表导入。每条记录必须包含 `did` 和 `license`，可在文件内提供 `pid` 列，也可填写默认 PID。</p>
      </div>
    </div>
    <form id="import-form" class="import-form">
      <label>
        <span>默认 PID</span>
        <input type="text" name="default_pid" placeholder="可选，文件中没有 pid 列时使用">
      </label>
      <label class="file-field">
        <span>Excel 文件</span>
        <input id="import-file-input" type="file" name="file" accept=".xlsx" required>
        <span id="import-file-note" class="file-field-note">支持 .xlsx，当前未选择文件</span>
      </label>
      <button type="submit" class="primary-btn" id="import-submit-btn">开始导入</button>
    </form>
    <div id="import-status-card" class="import-status-card hidden" aria-live="polite">
      <div class="import-status-head">
        <strong id="import-status-title">准备导入</strong>
        <span id="import-status-phase" class="muted">等待操作</span>
      </div>
      <div class="import-progress-track">
        <div id="import-progress-bar" class="import-progress-bar"></div>
      </div>
      <div id="import-progress-text" class="import-progress-text muted">尚未开始导入</div>
      <div id="import-summary" class="import-summary hidden">
        <div class="import-summary-item">
          <span>总行数</span>
          <strong id="import-summary-total">0</strong>
        </div>
        <div class="import-summary-item">
          <span>实际新增</span>
          <strong id="import-summary-inserted">0</strong>
        </div>
        <div class="import-summary-item">
          <span>跳过重复</span>
          <strong id="import-summary-skipped">0</strong>
        </div>
      </div>
    </div>
    <div id="import-result" class="import-feedback muted"></div>
    <div id="import-warnings" class="import-warning-box hidden">
      <div class="import-warning-title">导入告警</div>
      <ul id="import-warnings-list" class="import-warning-list"></ul>
    </div>
    <div id="import-errors" class="import-error-box hidden">
      <div class="import-error-title">失败明细</div>
      <ul id="import-errors-list" class="import-error-list"></ul>
    </div>
  </div>
</section>
