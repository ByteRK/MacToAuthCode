<section class="content-panel" id="access-control-panel">
  <div class="panel">
    <div class="panel-head">
      <div>
        <h2>访问控制</h2>
        <p class="muted">配置设备授权接口的请求 IP 白名单。支持单个 IP 和 CIDR 网段，保存后立即生效。</p>
      </div>
      <div class="panel-head-actions">
        <button type="button" class="ghost-btn" id="request-ip-whitelist-reload">刷新配置</button>
      </div>
    </div>
    <form id="request-ip-whitelist-form" class="stack access-control-form">
      <label class="switch-field access-switch-field">
        <input type="checkbox" id="request-ip-whitelist-enabled">
        <span>启用请求 IP 白名单</span>
      </label>
      <label>
        <span>允许访问的 IP / 网段</span>
        <textarea
          id="request-ip-whitelist-allowed-ips"
          rows="8"
          placeholder="每行一个，例如：&#10;192.168.1.10&#10;192.168.1.0/24"
        ></textarea>
      </label>
      <div class="muted access-control-hint">
        只有名单内的来源 IP 才能成功调用设备授权接口；保存后配置会持久化到本地数据库。
      </div>
      <div class="inline-form">
        <button type="submit" class="primary-btn">保存白名单配置</button>
      </div>
    </form>
    <div id="request-ip-whitelist-result" class="import-feedback muted"></div>
  </div>
</section>
