<section class="content-panel" id="logs-panel">
  <div class="panel">
    <div class="panel-head">
      <div>
        <h2>请求日志</h2>
        <p class="muted">实时观察设备请求、重复领码和库存不足等情况。</p>
      </div>
      <div class="inline-form">
        <label class="pagination-field logs-search-field">
          <span>关键词</span>
          <input
            type="text"
            id="logs-search-input"
            placeholder="输入 PID 或 MAC"
            autocomplete="off"
          >
        </label>
        <label class="pagination-field">
          <span>动作筛选</span>
          <select id="logs-action-filter">
            <option value="all">全部</option>
            <option value="assigned">assigned</option>
            <option value="reused">reused</option>
            <option value="exhausted">exhausted</option>
          </select>
        </label>
        <label class="pagination-field">
          <span>显示条数</span>
          <select id="logs-limit">
            <option value="20">20</option>
            <option value="50">50</option>
            <option value="100">100</option>
          </select>
        </label>
        <label class="switch-field">
          <input type="checkbox" id="logs-auto-refresh" checked>
          <span>自动刷新</span>
        </label>
        <button type="button" class="ghost-btn" id="logs-search-btn">筛选</button>
        <button type="button" class="ghost-btn" id="logs-search-reset-btn">清空</button>
        <button type="button" class="ghost-btn" id="logs-refresh-btn">立即刷新</button>
        <button type="button" class="primary-btn" id="logs-export-btn">导出日志</button>
      </div>
    </div>
    <div class="table-meta" id="logs-refresh-status">进入本页后将自动刷新日志。</div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>时间</th>
            <th>PID</th>
            <th>MAC</th>
            <th>动作</th>
            <th>DID</th>
            <th>载荷</th>
            <th>说明</th>
            <th>来源 IP</th>
          </tr>
        </thead>
        <tbody id="logs-body"></tbody>
      </table>
    </div>
  </div>
</section>
