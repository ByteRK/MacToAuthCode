<section class="content-panel" id="logs-panel">

      <div>
        <h2>请求日志</h2>
        <p class="muted">实时观察设备请求、重复领码和库存不足等情况。</p>
      </div>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>时间</th>
            <th>PID</th>
            <th>MAC</th>
            <th>动作</th>
            <th>DID</th>
            <th>载荷</th>
            <th>说明</th>
            <th>来源 IP</th>
          </tr>
        </thead>
        <tbody id="logs-body"></tbody>
      </table>
    </div>
  </div>
</section>
