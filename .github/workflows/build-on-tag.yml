name: Build On Tag

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            label: Windows
            artifact: windows-x64
          - os: ubuntu-latest
            label: Linux
            artifact: linux-x64
          - os: macos-latest
            label: macOS
            artifact: macos-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: yarn

      - name: Install Dependencies
        run: yarn install --frozen-lockfile

      - name: Run Tests
        run: yarn test

      - name: Build Standalone Package
        run: yarn package:standalone

      - name: Archive Package (Windows)
        id: archive-windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $assetName = "AuthCodePlatform-${env:GITHUB_REF_NAME}-${{ matrix.artifact }}.zip"
          Compress-Archive -Path .\release\AuthCodePlatform\* -DestinationPath $assetName -Force
          "asset_name=$assetName" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Archive Package (Unix)
        id: archive-unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          asset_name="AuthCodePlatform-${GITHUB_REF_NAME}-${{ matrix.artifact }}.tar.gz"
          tar -C release -czf "${asset_name}" AuthCodePlatform
          echo "asset_name=${asset_name}" >> "${GITHUB_OUTPUT}"

      - name: Upload Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.archive-windows.outputs.asset_name || steps.archive-unix.outputs.asset_name }}
          path: ${{ steps.archive-windows.outputs.asset_name || steps.archive-unix.outputs.asset_name }}
          if-no-files-found: error

  release:
    name: Publish Release Assets
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Or Update Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          assets=()
          while IFS= read -r -d '' file; do
            assets+=("${file}")
          done < <(find artifacts -type f \( -name '*.zip' -o -name '*.tar.gz' \) -print0)

          if [ "${#assets[@]}" -eq 0 ]; then
            echo "No release assets found under artifacts/"
            exit 1
          fi

          if gh release view "${TAG_NAME}" --repo "${GH_REPO}" >/dev/null 2>&1; then
            gh release upload "${TAG_NAME}" "${assets[@]}" --clobber --repo "${GH_REPO}"
          else
            gh release create "${TAG_NAME}" "${assets[@]}" --title "${TAG_NAME}" --generate-notes --repo "${GH_REPO}"
          fi
