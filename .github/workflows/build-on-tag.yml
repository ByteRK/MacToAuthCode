name: Build On Tag

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            label: Windows
            platform: windows
          - os: ubuntu-latest
            label: Linux
            platform: linux
          - os: macos-latest
            label: macOS
            platform: macos

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare Build Environment (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          python -m venv .venv
          python -m pip --python .\.venv\Scripts\python.exe install --upgrade pip
          python -m pip --python .\.venv\Scripts\python.exe install -r requirements.txt

      - name: Prepare Build Environment (Linux)
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          python3 -m venv .venv
          python -m pip --python ./.venv/bin/python install --upgrade pip
          python -m pip --python ./.venv/bin/python install -r requirements.txt

      - name: Prepare Build Environment (macOS)
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv
          uv venv .venv
          uv pip install --python ./.venv/bin/python -r requirements.txt

      - name: Build Package (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: .\scripts\package_win.ps1

      - name: Build Package (Linux)
        if: matrix.platform == 'linux'
        shell: bash
        run: chmod +x ./scripts/package_linux.sh && ./scripts/package_linux.sh

      - name: Build Package (macOS)
        if: matrix.platform == 'macos'
        shell: bash
        run: chmod +x ./scripts/package_mac.sh && ./scripts/package_mac.sh

      - name: Archive Package (Windows)
        id: archive
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $assetName = "AuthCodePlatform-${env:GITHUB_REF_NAME}-windows-x64.zip"
          if (Test-Path $assetName) {
            Remove-Item $assetName -Force
          }
          Compress-Archive -Path .\dist\AuthCodePlatform\* -DestinationPath $assetName -Force
          "asset_name=$assetName" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Archive Package (Linux)
        id: archive-linux
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          asset_name="AuthCodePlatform-${GITHUB_REF_NAME}-linux-x64.tar.gz"
          tar -C dist -czf "${asset_name}" AuthCodePlatform
          echo "asset_name=${asset_name}" >> "${GITHUB_OUTPUT}"

      - name: Archive Package (macOS)
        id: archive-macos
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          asset_name="AuthCodePlatform-${GITHUB_REF_NAME}-macos.tar.gz"
          tar -C dist -czf "${asset_name}" AuthCodePlatform
          echo "asset_name=${asset_name}" >> "${GITHUB_OUTPUT}"

      - name: Upload Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.archive.outputs.asset_name || steps.archive-linux.outputs.asset_name || steps.archive-macos.outputs.asset_name }}
          path: ${{ steps.archive.outputs.asset_name || steps.archive-linux.outputs.asset_name || steps.archive-macos.outputs.asset_name }}
          if-no-files-found: error

  release:
    name: Publish Release Assets
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Or Update Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          assets=()
          while IFS= read -r -d '' file; do
            assets+=("${file}")
          done < <(find artifacts -type f \( -name '*.zip' -o -name '*.tar.gz' \) -print0)

          if [ "${#assets[@]}" -eq 0 ]; then
            echo "No release assets found under artifacts/"
            exit 1
          fi

          echo "Resolved release assets:"
          printf ' - %s\n' "${assets[@]}"

          if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            gh release upload "${TAG_NAME}" "${assets[@]}" --clobber
          else
            gh release create "${TAG_NAME}" "${assets[@]}" --title "${TAG_NAME}" --generate-notes
          fi
