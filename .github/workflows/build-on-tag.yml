name: Build On Tag
on:
  push:
    tags: ['*']
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            artifact: windows-x64
          - os: ubuntu-latest
            artifact: linux-x64
          - os: macos-latest
            artifact: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn test
      - run: yarn package:standalone
      - name: Archive Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path release/AuthCodePlatform/* -DestinationPath AuthCodePlatform-${{ github.ref_name }}-${{ matrix.artifact }}.zip
      - name: Archive Unix
        if: runner.os != 'Windows'
        run: tar -C release -czf AuthCodePlatform-${{ github.ref_name }}-${{ matrix.artifact }}.tar.gz AuthCodePlatform
      - uses: actions/upload-artifact@v4
        with:
          name: AuthCodePlatform-${{ matrix.artifact }}
          path: AuthCodePlatform-*
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" artifacts/**/* --title "${{ github.ref_name }}" --generate-notes --repo "${{ github.repository }}"
